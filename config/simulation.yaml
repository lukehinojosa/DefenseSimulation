# Defense Simulation — data-driven scenario constants.
#
# These values drive the `defense_sim telemetry` engagement scenario (the one the
# C2 visualizer displays). Edit and re-run — no rebuild needed. Any key you omit
# falls back to the built-in default, and if this whole file is missing the sim
# still runs on defaults.
#
# Path resolution: the executable reads $SIM_CONFIG if set, otherwise it searches
# ./config/simulation.yaml and a couple of parent directories (so it works when
# run from a build subdirectory). See simulation.md for what each value does.
#
# Accelerations are in g (Earth gravities); distances in meters; speeds in m/s.

world:
  # Center of the defended city / battery, in world meters.
  defended_asset: [50000, 50000, 0]

time:
  scale: 0.6              # 1.0 = real time; 0.6 = 60% speed (legible slow-mo).
  duration_seconds: 70    # wall-clock length of the run.

rng_seed: 11              # deterministic raid; change for a different layout.

engagement:
  fuze_radius: 20.0                       # proximity fuze miss distance (m).
  nav_constant: 4.0                       # ProNav gain N (3–5 is well damped).
  interceptor_max_lateral_accel_g: 55.0   # interceptor turn G-limit.
  interceptor_axial_accel_g: 60.0         # interceptor thrust/drag limit.
  launch_handoff_altitude: 1000.0         # boost ceiling before guidance (m AGL).
  protected_radius: 6000.0                # threat grounding within this = asset loss.
  interceptor_fuel_seconds: 70.0          # motor life before self-disposal.
  safe_disposal_radius: 12000.0           # min range to self-detonate a spent round.
  loiter_radius: 12000.0                  # CAP holding orbit radius for idle rounds.
  loiter_altitude: 6000.0                 # CAP holding orbit altitude.
  separation_radius: 600.0                # begin avoiding a fellow defender within (m).
  separation_accel_g: 60.0                # collision-avoidance authority.

threats:
  count: 16
  spawn_range_min: 23000.0     # random distance from the asset (m).
  spawn_range_max: 36000.0
  spawn_altitude_min: 0.0      # random start altitude (m); 0 = ground launch.
  spawn_altitude_max: 7000.0
  boost_speed: 600.0           # vertical boost speed off the pad.
  cruise_speed: 950.0          # ballistic cruise speed onto the city.
  max_lateral_accel_g: 12.0    # sluggish pitch-over (higher = tighter arc).
  axial_accel_g: 25.0

interceptors:
  friendly:                    # own, ground-launched from the battery
    standing_battery: 8        # rounds fired at t=0.
    max_launched: 40           # hard cap on total friendly launches.
    pad_radius: 11000.0        # battery ring radius (m): outside the ~9 km city
                               # skyline + 6 km protected zone, so rounds never
                               # climb up through the buildings.
    cruise_speed: 1300.0
    launch_cooldown: 0.15      # min seconds between demand-driven launches.

  neutral:                     # allied, airborne — engaged but not trusted
    count: 8
    spawn_range_min: 18000.0   # random distance in from the asset (m).
    spawn_range_max: 22000.0
    spawn_altitude_min: 2500.0
    spawn_altitude_max: 9000.0
    cruise_speed: 1400.0
    inbound_speed: 900.0       # initial inbound cruise so it flies a natural approach.
